# Prometheus configuration for the full Docker Compose stack (docker-compose.yml),
# where the API runs as the "api" service. monitoring/prometheus/prometheus.yml is the
# variant for an API running on the host (docker-compose.monitoring.yml).
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "/etc/prometheus/alerts.yml"

scrape_configs:
  - job_name: "mlops-api"
    static_configs:
      - targets: ["api:8000"]
        labels:
          environment: "docker"
