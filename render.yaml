# Render Blueprint: the whole stack on two free web services.
#   One-click deploy: https://render.com/deploy?repo=https://github.com/THEProgrammingGod69/MLOPS
#
#   student-dropout-ews             FastAPI + web UI           (about 390 MB of the 512 MB free)
#   student-dropout-ews-monitoring  Prometheus + Grafana       (about 200 MB)
#
# Free services sleep after 15 idle minutes and take about a minute to wake. The monitoring
# service wakes the API itself before it starts scraping, and reloads an hour of recorded
# history at every boot, so a cold start never shows a false "DOWN" or empty charts.
# Service URLs are https://<name>.onrender.com unless Render had to add a suffix because the
# name was taken: then update API_URL, GRAFANA_URL and PROMETHEUS_URL below.
services:
  - type: web
    name: student-dropout-ews
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./deploy/render/api.Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: GRAFANA_URL
        value: https://student-dropout-ews-monitoring.onrender.com/grafana
      - key: PROMETHEUS_URL
        value: https://student-dropout-ews-monitoring.onrender.com/prometheus
      - key: DEMO_TRAFFIC_RPS
        value: "1"
      - key: SIM_SCHEDULE
        value: normal:1200,engagement-drop:600

  - type: web
    name: student-dropout-ews-monitoring
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./deploy/render/monitoring.Dockerfile
    dockerContext: .
    healthCheckPath: /grafana/api/health
    autoDeploy: true
    envVars:
      - key: API_URL
        value: https://student-dropout-ews.onrender.com
