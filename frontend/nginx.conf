# Serves the built SPA and proxies API calls to the FastAPI container, so the
# browser only ever talks to one origin (no CORS needed).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        client_max_body_size 20m;
    }

    location ~ ^/(docs|openapi\.json)$ {
        proxy_pass http://api:8000;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Hashed build assets can be cached forever; index.html must always revalidate.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
